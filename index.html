<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AMC Ticket View</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #8fa0ae;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    
    .phone-screen {
        width: 100%;
        max-width: 412px;
        height: 100vh;
        max-height: 915px;
        background-color: #8fa0ae;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }

    .top-bar {
        background-color: #e67e22;
        color: white;
        padding: 18px 16px;
        font-size: 22px;
        font-weight: 500;
        display: flex;
        align-items: center;
        user-select: none;
        cursor: pointer; /* Indica che è cliccabile */
        transition: background-color 0.15s ease;
    }
    .top-bar:active {
        background-color: #d35400; /* Feedback visivo al tap */
    }
    .top-bar .back-arrow {
        margin-right: 6px;
        font-weight: 300;
    }

    .ticket-card {
        background: #ffffff;
        border-radius: 24px;
        margin: 0 16px;
        padding: 20px 0;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        flex-grow: 0;
    }

    .validity-section {
        display: flex;
        justify-content: space-between;
        padding: 0 32px 14px 32px;
    }
    .time-block {
        display: flex;
        flex-direction: column;
    }
    .time-block.right {
        text-align: right;
    }
    .time-label {
        font-size: 12px;
        color: #7f8c8d;
        margin-bottom: 2px;
    }
    .time-val {
        font-size: 22px;
        font-weight: 700;
        color: #003399;
    }
    .date-val {
        font-size: 10px;
        color: #333;
        margin-top: 2px;
    }

    .dashed-line {
        border-top: 2px dashed #e0e0e0;
        margin: 0 14px;
        height: 0;
    }

    .qr-section {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 22px 0;
    }
    .qr-container {
        padding: 10px;
        background: white;
    }

    .details-section {
        padding: 20px 32px 14px 32px;
    }
    .info-block {
        margin-bottom: 16px;
    }
    .info-row {
        display: flex;
        justify-content:- space-between;
    }
    .label {
        font-size: 13px;
        color: #555;
        margin-bottom: 4px;
    }
    .value {
        font-size: 13px;
        font-weight: 700;
        color: #000000;
    }

    .state-block {
        text-align: left;
        min-width: 65px;
        margin-left: auto;
        margin-right: 8px;
    }

    .company-footer {
        text-align: center;
        font-size: 13px;
        color: #7f8c8d;
        line-height: 1.6;
        margin-top: 16px;
    }

    .android-nav {
        background-color: #f8f9fa;
        height: 48px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid #e0e0e0;
        width: 100%;
    }
    .nav-icon {
        width: 18px;
        height: 18px;
        opacity: 0.6;
    }
</style>
</head>
<body>

<div class="phone-screen">
    
    <!-- Pulsante Indietro configurato con il link -->
    <div class="top-bar" id="backBtn" role="button" tabindex="0">
        <span class="back-arrow">&lt;</span> Indietro
    </div>

    <div class="ticket-card">
        <div class="validity-section">
            <div class="time-block">
                <span class="time-label">Valido da</span>
                <span class="time-val">18:03</span>
                <span class="date-val">29/07/2026</span>
            </div>
            <div class="time-block right">
                <span class="time-label">Valido fino</span>
                <span class="time-val">19:36</span>
                <span class="date-val">29/07/2026</span>
            </div>
        </div>

        <div class="dashed-line"></div>

        <div class="qr-section">
            <div class="qr-container">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=Ticket__340005_Validato" alt="QR Code">
            </div>
        </div>

        <div class="dashed-line"></div>

        <div class="details-section">
            <div class="info-block info-row">
                <div>
                    <div class="label">Ticket N.</div>
                    <div class="value">340005</div>
                </div>
                <div class="state-block">
                    <div class="label">Stato</div>
                    <div class="value" style="color: #000000;">Validato</div>
                </div>
            </div>

            <div class="info-block">
                <div class="label">Prezzo</div>
                <div class="value">1.80 €</div>
            </div>

            <div class="info-block">
                <div class="label">Acquistato il</div>
                <div class="value">29/07/2026 17:02</div>
           </div>

            <div class="info-block">
                <div class="label">Tariffa</div>
                <div class="value">Biglietto a Tempo - 90 min</div>
            </div>

            <div class="info-block" style="margin-bottom: 0;">
                <div class="label">Ultima validazione il</div>
                <div class="value">29/07/2026 18:03</div>
            </div>
        </div>

        <div class="dashed-line"></div>
    
        <div class="company-footer">
            Società: <strong>Amc Catanzaro</strong><br>
            P.IVA: 02161810797
        </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div class="android-nav">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><line x1="4" y1="21" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="3"></line></svg>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect></svg>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
</div>

<script>
    // Reindirizza al sito AMC quando viene cliccato il tasto
    document.getElementById('backBtn').addEventListener('click', function() {
        window.location.href = 'https://shop.bigosolutions.it/amccatanzaro/account/myticket/';
    });
</script>

</body>
</html>
